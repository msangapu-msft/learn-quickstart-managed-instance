# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: learn-quickstart-managed-instance
metadata:
  template: learn-quickstart-managed-instance
infra:
  provider: bicep
  path: infra
  module: main
  parameters:
    location: westcentralus
    resourceGroupName: rg-managed-instance

hooks:
  preprovision:
    posix:
      shell: sh
      run: ./azd-hooks/preprovision.sh
      interactive: true
      continueOnError: false
      
  postprovision:
    posix:
      shell: sh
      run: ./azd-hooks/postprovision.sh
      interactive: true
      continueOnError: false